# docker compose up -d --build
#
# 2 service แยกกันตามภาษา/ทรัพยากร:
#   ocr  = Python + PaddleOCR (CPU, ~720MB RAM)  — ไม่เปิดพอร์ตออกนอก
#   bot  = Node + Express      (~90MB RAM)        — รับ webhook จาก LINE
#
# 🔒 ไม่มี secret ในไฟล์นี้ — ทุกอย่างอ่านจาก .env (ซึ่ง gitignore ไว้)
#    คัดลอกจาก .env.example แล้วเติมค่าเอง

services:
  ocr:
    build: ./ocr
    restart: unless-stopped
    environment:
      # ตั้ง SLIP_OCR_TOKEN ใน .env แล้วทั้งสอง service จะใช้ค่าเดียวกัน
      SLIP_OCR_TOKEN: ${OCR_TOKEN:-}
      # container เห็น cpu_count ของ host เสมอ (ไม่ใช่ของ quota) → paddle จะสร้าง thread
      # เกินจำเป็นแล้วแย่งกันเอง ตั้งให้เท่าจำนวน core ที่มีจริง
      OMP_NUM_THREADS: ${OCR_THREADS:-2}
      MKL_NUM_THREADS: ${OCR_THREADS:-2}
    # ไม่ publish พอร์ตออกนอกเครื่อง — ให้ bot เรียกผ่าน network ภายในเท่านั้น
    expose:
      - "8101"
    deploy:
      resources:
        limits:
          # **ไม่จำกัด cpu** — วัดแล้วเวลา OCR แปรผกผันกับจำนวน core เกือบเป๊ะ
          #   1.5 core = 10.1 วิ · 2 core = 8.5 วิ · 4 core = 4.2 วิ · 8 core = 2.2 วิ
          # ตั้ง quota ต่ำกว่าที่เครื่องมี = ทำให้ช้าลงเปล่า ๆ ส่วน bot ใช้ CPU แค่ ~3ms
          # ต่อ webhook ซึ่ง scheduler ของ Linux แบ่งให้ได้อยู่แล้วโดยไม่ต้องกันโควตาไว้
          memory: 1600M

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      ocr:
        condition: service_healthy
    env_file:
      - .env                       # LINE_CHANNEL_SECRET / LINE_CHANNEL_ACCESS_TOKEN
    environment:
      PORT: 3000
      OCR_ENDPOINT: http://ocr:8101   # ชื่อ service ใน compose network
      OCR_TIMEOUT_MS: ${OCR_TIMEOUT_MS:-120000}
    ports:
      - "127.0.0.1:3000:3000"      # ผูกกับ localhost เท่านั้น — ให้ reverse proxy (Caddy) ต่อหน้า
    volumes:
      - bot-data:/app/data         # SQLite ต้องอยู่รอดตอน recreate container
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  bot-data:
